name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Real OCR tools, so the OCR tests run for real instead of being skipped.
      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q -rs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml config -q

      - name: Build
        run: docker build --build-arg VERSION=ci -t readcue:ci .

      - name: Runs as an unprivileged user with OCR tools present
        run: |
          test "$(docker run --rm --entrypoint id readcue:ci -u)" != "0"
          docker run --rm --entrypoint tesseract readcue:ci --version
          docker run --rm --entrypoint pdftoppm readcue:ci -v
          docker run --rm readcue:ci --version

      - name: OCR works inside the image
        run: docker run --rm -v "$PWD/scripts:/scripts:ro" --entrypoint python readcue:ci /scripts/smoke_ocr.py

      - name: Refuses to run open to the network without a password
        run: |
          if docker run --rm -e READCUE_BIND=0.0.0.0 readcue:ci serve --host 0.0.0.0 2> refusal.txt; then
            echo "expected the container to refuse to start"; exit 1
          fi
          cat refusal.txt
          grep -q "no login" refusal.txt

      - name: Starts, becomes healthy and serves the UI
        run: |
          docker run -d --name readcue -p 127.0.0.1:8080:8080 -e READCUE_BIND=127.0.0.1 readcue:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' readcue)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          test "$status" = "healthy"
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          curl -fsS http://127.0.0.1:8080/ | grep -q "set up your first course"
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"
          curl -fsS http://127.0.0.1:8080/static/style.css | head -c 80
          echo
          docker exec readcue readcue backup --to /tmp/ci-backup.db

      - name: Logs
        if: always()
        run: docker logs readcue || true
