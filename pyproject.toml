[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readcue"
dynamic = ["version"]
description = "Self-hosted: summarize textbook chapters ahead of their syllabus due dates and remind you via Pushover."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OwenWright8"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7,<2",
    "flask>=3.1,<4",
    "pypdf>=6,<7",
    "waitress>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/OwenWright8/readcue"
Changelog = "https://github.com/OwenWright8/readcue/blob/main/CHANGELOG.md"

[project.scripts]
readcue = "readcue.cli:main"

[tool.setuptools.dynamic]
version = {attr = "readcue.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readcue = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter wraps code; long strings and comments are left alone

[tool.pytest.ini_options]
testpaths = ["tests"]
